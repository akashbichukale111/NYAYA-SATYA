name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: NYAYA-SATYA Production Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest httpx fastapi uvicorn pydantic jinja2 python-multipart

      - name: Run 17-Subsystem Production Verification Suite
        run: |
          pytest tests/test_solution_quality_and_integrations.py -v

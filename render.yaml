services:
  - type: web
    name: nyaya-satya
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: PRODUCTION
      - key: UNWIND_OPERATOR_TOKENS
        value: dev-operator-token:ADMIN
